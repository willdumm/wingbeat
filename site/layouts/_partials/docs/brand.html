<h2 class="book-brand">
  <a class="flex align-center" href="{{ cond (not .Site.Home.File) .Sites.Default.Home.RelPermalink .Site.Home.RelPermalink }}">
    {{- with .Site.Params.BookLogo -}}
    <img class="book-brand-logo book-brand-logo-light" src="{{ . | relURL }}" alt="" />
    {{- end -}}
    {{- with .Site.Params.BookLogoDark -}}
    <img class="book-brand-logo book-brand-logo-dark" src="{{ . | relURL }}" alt="" />
    {{- end -}}
    <span>{{ .Site.Title }}</span>
  </a>
</h2>
