# Prompts contributors to sign CLA.md on their first pull request, using
# https://github.com/contributor-assistant/github-action.
#
# Notes:
#   - The upstream action repo is archived (read-only) as of March 2026. Existing
#     releases still work, and it's pinned to a commit SHA below for stability, but it
#     won't receive updates. Revisit if it stops working.
#   - No extra secret is needed: signatures are stored in-repo on the
#     `cla-signatures` branch using the built-in GITHUB_TOKEN.

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://raw.githubusercontent.com/willdumm/wingbeat/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: dependabot[bot]
